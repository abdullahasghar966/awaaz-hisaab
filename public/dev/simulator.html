<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awaaz Hisaab simulator</title>
  <style>
    :root {
      --bg: #eef1f4;
      --panel: #ffffff;
      --text: #1d2330;
      --muted: #5d6675;
      --line: #d9dde5;
      --me: #d9f5e7;
      --bot: #ffffff;
      --accent: #1f6f5c;
      --accent-text: #ffffff;
      --system: #fff4d6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12151b;
        --panel: #1b2029;
        --text: #e8ebf1;
        --muted: #9aa3b2;
        --line: #2e3643;
        --me: #1f4a3c;
        --bot: #242b37;
        --accent: #4fb89c;
        --accent-text: #0f1714;
        --system: #4a3f1c;
      }
    }
    :root[data-theme="dark"] {
      --bg: #12151b;
      --panel: #1b2029;
      --text: #e8ebf1;
      --muted: #9aa3b2;
      --line: #2e3643;
      --me: #1f4a3c;
      --bot: #242b37;
      --accent: #4fb89c;
      --accent-text: #0f1714;
      --system: #4a3f1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Naskh Arabic", sans-serif;
      min-height: 100vh;
    }
    main#simulator {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100vh;
    }
    h1 { font-size: 1.2rem; margin: 0; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input, button {
      font: inherit;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      max-width: 100%;
    }
    input[type="tel"] { width: 180px; }
    select {
      font: inherit;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      max-width: 100%;
    }
    .interim { min-height: 1.2em; margin: -6px 0 0; font-style: italic; overflow-wrap: anywhere; }
    #text { flex: 1 1 200px; min-width: 0; }
    button {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      cursor: pointer;
    }
    button[aria-pressed="true"] { background: #b3261e; border-color: #b3261e; color: #fff; }
    button:disabled { opacity: 0.6; cursor: default; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .chat {
      flex: 1 1 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      min-height: 360px;
      max-height: 65vh;
    }
    .bubble {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--bot);
      overflow-wrap: anywhere;
    }
    .bubble.me { align-self: flex-end; background: var(--me); }
    .bubble.bot { align-self: flex-start; }
    .bubble.system { align-self: center; background: var(--system); max-width: 95%; }
    .bubble-text { white-space: pre-wrap; }
    .bubble-meta { color: var(--muted); font-size: 0.8rem; margin-top: 4px; white-space: pre-wrap; }
    .status { color: var(--muted); min-height: 1.4em; margin: 0; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
    @media (max-width: 480px) {
      main#simulator { padding: 12px; }
      .bubble { max-width: 92%; }
    }
  </style>
</head>
<body>
  <main id="simulator">
    <header class="row">
      <h1>Awaaz Hisaab simulator</h1>
      <span class="muted">Dev only. Replies are not sent to WhatsApp.</span>
    </header>
    <p class="muted">Voice is transcribed by your browser (Chrome/Edge) in this demo. Real WhatsApp voice notes use the server's speech-to-text.</p>

    <div class="row">
      <label for="phone" class="muted">Phone</label>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="off" value="923001234567">
      <label for="lang" class="muted">Voice language</label>
      <select id="lang"></select>
    </div>

    <section id="log" class="chat" role="log" aria-live="polite" aria-label="Conversation"></section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p id="interim" class="muted interim" dir="auto" aria-live="off"></p>

    <form id="composer" class="row">
      <label for="text" class="sr-only">Message</label>
      <input id="text" type="text" dir="auto" autocomplete="off" placeholder="Type a message, e.g. aaj 5000 ki sale hui">
      <button type="submit" id="send">Send</button>
      <button type="button" id="record" aria-pressed="false">Hold to record</button>
    </form>
  </main>

  <script type="module" src="simulator.js"></script>
</body>
</html>
